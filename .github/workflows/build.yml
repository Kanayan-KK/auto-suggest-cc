name: build

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    name: Build beta extension
    runs-on: ubuntu-latest
    if: >
      contains('push,workflow_dispatch', github.event_name) ||
      contains(github.event.pull_request.labels.*.name, 'wait-to-build')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup nodejs
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Setup package
        run: yarn install

      - name: Prepare gitmoji data for tests
        run: node prepare.js

      - name: Run tests
        run: yarn test

      - name: Bump version
        run: |
          npx commit-and-tag-version --skip.changelog --skip.commit --skip.tag

      - name: Generate name for artifact
        uses: actions/github-script@v9
        id: version
        with:
          result-encoding: string
          script: |
            core.setOutput('repo', context.repo.repo);
            core.setOutput('beta', process.env.GITHUB_SHA.slice(0,7));

      - name: Edit version for building
        env:
          SUFFIX: ${{steps.version.outputs.beta}}
        run: |
          sed -r 's/"version": "(.*)"/"version": "\1-${{ env.SUFFIX }}"/' -i package.json

      - name: Build artifact
        run: yarn build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.version.outputs.repo}}-${{steps.version.outputs.beta}}.vsix
          path: "*.vsix"
